# systemd drop-in for chkrootkit.service — installed to
#   /etc/systemd/system/chkrootkit.service.d/override.conf
#
# Why this exists: chkrootkit's "zero-size shell history files" and
# "hardlinked shell history files" checks are both gated on $SHELL and $HOME
# being set in the invoking environment (chkrootkit:1343 and :1350). systemd
# services start with an empty environment, so under chkrootkit.timer both
# checks report "not tested" and never actually run.
#
# That silent gap also produced a daily false-positive alert: log.expected was
# captured from a shell-context run ("not found"), every timer run diffs
# "not tested" against it, and chkrootkit-daily mails root about the change.
# Setting the two variables restores the checks instead of baselining a skipped
# test as if it were a result.
[Service]
Environment=HOME=/root
Environment=SHELL=/bin/bash
