# =============================================================================
# Marvin — nginx site configuration
# =============================================================================
# Tracked copy of /etc/nginx/sites-available/marvin
#
# Deploy:
#   cp setup/nginx-site.conf /etc/nginx/sites-available/marvin
#   ln -sf /etc/nginx/sites-available/marvin /etc/nginx/sites-enabled/marvin
#   nginx -t && systemctl reload nginx
#
# Dependencies (defined in /etc/nginx/nginx.conf http{} block):
#   limit_req_zone directives — tracked in setup/nginx-rate-limits.conf,
#       deployed to /etc/nginx/conf.d/marvin-rate-limits.conf.
#       Current values: general=30r/s, api=30r/s, sensitive=2r/s,
#                       monitoring=5r/s (PR #674).
#   limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
#   limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
#   limit_req_zone $binary_remote_addr zone=sensitive:10m rate=2r/s;
#   limit_req_zone $binary_remote_addr zone=monitoring:10m rate=5r/s;
#   limit_req_status 429;
#   map $http_x_api_key $export_api_key_header { ... }
#
# SSL: managed by Certbot (certbot --nginx -d robot-marvin.cz)
# =============================================================================

server {
    server_name robot-marvin.cz;

    # Next.js blog API — proxy to Node.js
    location /api/blog {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js blog insert API — proxy to Node.js
    location /api/blog-insert {
        limit_req zone=sensitive burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block public access to sensitive data directories (security scans, email metadata, comms)
    location /api/security/ {
        deny all;
        return 403;
    }
    location /api/email/ {
        deny all;
        return 403;
    }
    location /api/comms/ {
        deny all;
        return 403;
    }
    location ~* ^/api/lessons- {
        deny all;
        return 403;
    }

    # Internal auth check for export API key (used by auth_request)
    location = /auth/validate-export-key {
        internal;
        if ($export_api_key_header != "valid") {
            return 401;
        }
        return 200;
    }

    # Export API auth error handler
    location @export_auth_error {
        internal;
        default_type application/json;
        return 401 '{"error":"unauthorized","message":"API key required. Use X-API-Key header."}';
    }

    # Export API — requires X-API-Key header (auth_request replaces if+alias anti-pattern)
    location /api/exports/ {
        limit_req zone=api burst=40 nodelay;
        auth_request /auth/validate-export-key;
        error_page 401 = @export_auth_error;

        alias /home/marvin/git/data/exports/;
        default_type application/json;
        gzip_static on;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "no-cache";
    }

    # Static JSON API endpoints (generated data files — served by nginx directly).
    #
    # ALLOWLIST, not a denylist. `alias /home/marvin/git/data/` under a bare
    # `location /api/` publishes every file in data/ that nobody remembered to
    # deny — and data/ grows new subdirectories continuously (logs/, incidents/,
    # tests/, codebase/, web-backup/ all arrived after the deny rules below were
    # written, and all were world-readable as a result). Fail closed instead:
    # only paths listed here are public, everything else under /api/ is 403.
    #
    # A regex location wins over a prefix location, so this block also decides
    # /api/blog-index.json (otherwise swallowed by `location /api/blog` and
    # proxied to Next.js, which 404s it) and /api/security/security-score.json
    # (otherwise caught by the `location /api/security/` deny below). Both are
    # documented as public in data/openapi.yaml.
    #
    # $1 can only ever be one of the literal alternatives below, so the capture
    # is not a path-traversal vector. Keep this list in sync with
    # data/openapi.yaml when adding a public endpoint.
    location ~ ^/api/((?:about|blog-index|changelog|comms-summary|enhancements|external-domains|metrics-history|peer-health|peers-public|status|thoughts|uptime)\.json|(?:alerts/active-alerts|incidents/active-incidents|incidents/summary|metrics/recent|metrics/sla|peers/registry|security/security-score)\.json|reports/weekly-card-latest\.svg)$ {
        limit_req zone=api burst=40 nodelay;
        alias /home/marvin/git/data/$1;
        default_type application/json;
        gzip_static on;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "no-cache";
    }

    # Everything else under /api/ that is not an explicit endpoint above and not
    # one of the proxied/authenticated locations: not public.
    #
    # Keeps `limit_req zone=api`: the old single /api/ block rate-limited all
    # /api/ traffic, and without it the split would drop that control on
    # precisely the traffic that now lands here — scanners walking /api/.env
    # and friends. (Issue #863.)
    #
    # `deny all`, NOT `return 403` — this is load-bearing and not a style
    # choice. `return` is handled by the rewrite module in the REWRITE phase,
    # which runs BEFORE the PREACCESS phase where limit_req lives, so a
    # `limit_req` sitting next to a `return 403` never executes: the request is
    # already finished. `deny` is the access module, ACCESS phase, which runs
    # after PREACCESS — so the limit is actually applied. Both spellings return
    # the same 403, which is exactly what makes the broken one hard to spot.
    # Measured, not reasoned: at rate=1r/s burst=40, `return 403` served 60/60
    # requests unthrottled while `deny all` served 41 then shed 19.
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        deny all;
    }

    # Everything below serves real content and carried no limiter at all until
    # issue #954: limit_req is declared per-location here and nowhere at server
    # or http level, so an omission is not a weaker limit, it is none. Two
    # tiers, sized from the access log rather than picked:
    #   burst=50 — assets a single page load fetches in parallel (/_next/static/,
    #     /blog/). Measured organic peak over 44h: 14 and 15 req/s per IP, both
    #     against zone=general's 30 r/s.
    #   burst=20 — single-fetch discovery documents; nothing requests them in
    #     parallel. Busiest is ai-managed.json at 38 hits in 44h.
    #
    # Next.js static assets — served directly by nginx
    location /_next/static/ {
        limit_req zone=general burst=50 nodelay;
        alias /home/marvin/git/web/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # AI discovery endpoint
    location /.well-known/ai-managed.json {
        limit_req zone=general burst=20 nodelay;
        alias /home/marvin/git/data/comms/identity.json;
        default_type application/json;
        add_header Access-Control-Allow-Origin "*";
    }

    # A2A-style agent card — what AI-discovery scanners (e.g. Umai-Scanner) probe for.
    # Static, read-only, mirrors the public beacon. No mcp.json: MCP surface is localhost-only.
    location = /.well-known/agent.json {
        limit_req zone=general burst=20 nodelay;
        alias /home/marvin/git/web/public/.well-known/agent.json;
        default_type application/json;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "max-age=3600";
    }

    # A2A v0.3 renamed the card to agent-card.json and kept agent.json as the legacy path.
    # We probe peers at the new name, so we must answer on it too — same document, both names.
    location = /.well-known/agent-card.json {
        limit_req zone=general burst=20 nodelay;
        alias /home/marvin/git/web/public/.well-known/agent.json;
        default_type application/json;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "max-age=3600";
    }

    # OpenAPI specification
    location /.well-known/openapi.yaml {
        limit_req zone=general burst=20 nodelay;
        alias /home/marvin/git/data/openapi.yaml;
        default_type text/yaml;
        add_header Access-Control-Allow-Origin "*";
    }

    # GPG public key
    location /.well-known/marvin-gpg.asc {
        limit_req zone=general burst=20 nodelay;
        alias /home/marvin/git/web/public/.well-known/marvin-gpg.asc;
        default_type application/pgp-keys;
        add_header Access-Control-Allow-Origin "*";
    }

    # RFC 9116 security contact (Next.js's static handler skips dotfile dirs in public/)
    location = /.well-known/security.txt {
        limit_req zone=general burst=20 nodelay;
        alias /home/marvin/git/web/public/.well-known/security.txt;
        default_type text/plain;
        add_header Cache-Control "max-age=86400";
    }

    # llms.txt — emerging convention for AI agents/crawlers (Next.js proxy 404s on it)
    location = /llms.txt {
        limit_req zone=general burst=20 nodelay;
        alias /home/marvin/git/web/public/llms.txt;
        default_type text/markdown;
        add_header Cache-Control "max-age=86400";
        add_header Access-Control-Allow-Origin "*";
    }

    # AI protocol negotiation — accept POST proposals
    #
    # SCOPE OF THE limit_req BELOW: it covers POST, and only POST. The same
    # phase ordering documented at `location /api/` above applies here in the
    # other direction — both `return`s in this block are the rewrite module
    # (REWRITE phase), so they finish the request before PREACCESS, where
    # limit_req lives, is ever reached. Measured 2026-07-29 against live:
    # 30 concurrent OPTIONS -> 30x204, 30 concurrent GET -> 30x405, zero 429
    # in either. Control, same host, same minute: 30 concurrent to
    # /api/blog-insert (zone=sensitive burst=5) -> 24x429. The limiter is
    # armed; it simply never runs for a method that short-circuits.
    #
    # Left as-is deliberately (issue #954). The fix would be to stop
    # short-circuiting — drop the OPTIONS branch and spell the method gate
    # `limit_except POST { deny all; }`, which is the ACCESS phase and so runs
    # after the limit. That trades a correct 405 for a 403, breaks CORS
    # preflight for any browser-based peer, and buys rate limiting on two
    # responses that cost nginx a header each: no upstream, no disk read, no
    # body. A 429 is not cheaper than the 204 it would replace — it also
    # writes an error.log line. POST is the arm that reaches proxy_pass and
    # the 16k body buffer, and POST is the arm that is limited.
    location /.well-known/ai-negotiate {
        limit_req zone=sensitive burst=3 nodelay;
        client_max_body_size 16k;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, X-AI-Identity, X-AI-Protocol";
            return 204;
        }

        if ($request_method != 'POST') {
            return 405;
        }

        # NO client_body_temp_path / client_body_in_file_only here (issue #854).
        # Both were vestiges of the original design, in which nginx itself was to
        # deposit the raw proposal into the handler's inbox ("Write request body
        # to inbox"). That design was replaced by the socat listener, which reads
        # the body from stdin (negotiate-listener.sh: `head -c $content_length`)
        # and writes its own sanitized *.json record — so the directives fed
        # nothing, while `in_file_only on` means nginx NEVER removes the temp
        # file. Every POST to this public endpoint left a permanent, raw,
        # attacker-controlled file inside the directory the handler globs, at up
        # to 16k and 2 r/s per IP (zone=sensitive), swept by nothing.
        # Default handling (body in memory, spilled to /var/lib/nginx/body only
        # if it exceeds client_body_buffer_size, removed after the request) still
        # forwards the body to the upstream, which is all this location needs.
        proxy_pass http://127.0.0.1:8043;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-Id $request_id;
    }

    # Serve negotiation responses
    location /.well-known/ai-negotiate-response/ {
        limit_req zone=general burst=20 nodelay;
        alias /home/marvin/git/data/comms/negotiate-outbox/;
        default_type application/json;
        add_header Access-Control-Allow-Origin "*";
    }

    # Blog markdown files (legacy)
    location /blog/ {
        limit_req zone=general burst=50 nodelay;
        alias /home/marvin/blog/;
        default_type text/markdown;
    }

    # Next.js pages — proxy everything else to Node.js
    location / {
        limit_req zone=general burst=50 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "0";
    add_header X-Managed-By "Marvin (Claude Code AI)";

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/robot-marvin.cz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/robot-marvin.cz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = robot-marvin.cz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;

    server_name robot-marvin.cz;

    # Block sensitive API endpoints on plaintext HTTP (defense-in-depth for #250)
    location /api/exports/ {
        return 403 '{"error":"forbidden","message":"Use HTTPS for API key endpoints."}';
    }

    # AI discovery endpoint — also serve on plain HTTP for IP-based peer discovery
    location /.well-known/ai-managed.json {
        limit_req zone=general burst=20 nodelay;
        alias /home/marvin/git/data/comms/identity.json;
        default_type application/json;
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        return 404; # managed by Certbot
    }
}
