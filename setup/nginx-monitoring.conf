# =============================================================================
# Marvin — monitoring subdomain nginx configuration
# =============================================================================
# Proxies monitoring.robot-marvin.cz → Grafana (127.0.0.1:3001)
# Protected by HTTP Basic Auth.
#
# Deploy:
#   htpasswd -c /etc/nginx/.htpasswd-monitoring <username>
#   chmod 640 /etc/nginx/.htpasswd-monitoring
#   chown root:www-data /etc/nginx/.htpasswd-monitoring
#   cp setup/nginx-monitoring.conf /etc/nginx/sites-available/monitoring
#   ln -sf /etc/nginx/sites-available/monitoring /etc/nginx/sites-enabled/monitoring
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d monitoring.robot-marvin.cz
#
# Brute-force protection (defense-in-depth):
#   1. HTTP Basic Auth at server level (fail closed before Grafana sees request)
#   2. nginx rate limit on dynamic endpoints — `monitoring` zone, 5r/s burst=8
#      (per #673 review feedback; tuned for parallel Grafana page loads)
#   3. fail2ban `nginx-http-auth` jail — catches auth failures that NAME a user
#      ("password mismatch", "was not found in"). It does NOT watch 401s, and
#      this line claimed that it did. nginx writes nothing to error.log for a
#      401 against a request that supplied no credentials at all, so a scanner
#      that never guesses a username produces no line for any filter to match.
#      Measured 2026-07-29: one host took 47 401s off this vhost and the jail's
#      counter stayed at 0, as it had through all 15 days of retained
#      error.log. Sending a bogus username instead does log, and does count —
#      that is the whole of what this jail covers.
#   4. Grafana's built-in login rate limiter
#
# What actually stopped that scanner was #2 — it collected 12x 429. The stock
# `nginx-limit-req` jail bans on exactly those events and is deliberately NOT
# enabled: 50 of the 62 limit_req events in error.log are 127.0.0.1 — our own
# self-probes and the Grafana proxy path. Switching that jail on before
# `ignoreip` is deployed (see bootstrap.sh) would ban loopback, not scanners.
#
# /public/ and /avatar/ are exempt from nginx rate limiting — they are static
# assets fetched in parallel by Grafana's frontend on every page render and
# would exhaust any practical burst (issue #673). Auth still required.
#
# Reference: https://github.com/INFO-WEB-s-r-o/Marvin/issues/571
#            https://github.com/INFO-WEB-s-r-o/Marvin/issues/673
# =============================================================================

server {
    server_name monitoring.robot-marvin.cz;

    # Basic authentication
    auth_basic "Marvin Monitoring";
    auth_basic_user_file /etc/nginx/.htpasswd-monitoring;

    # Proxy to Grafana — auth + rate limit on dynamic endpoints.
    # Uses the `monitoring` zone (5r/s) defined in marvin-rate-limits.conf.
    location / {
        limit_req zone=monitoring burst=8 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Grafana frontend bundles, images, fonts — auth required, no rate limit
    location /public/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # User avatars — auth required, no rate limit
    location /avatar/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana WebSocket for live updates — rate-limit only the initial
    # HTTP Upgrade handshake (limit_req does not throttle WebSocket frames
    # after the connection is established). Restores parity with the prior
    # server-level limit that covered this path before the static-asset
    # fix split locations apart.
    location /api/live/ {
        limit_req zone=monitoring burst=8 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "0";

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/monitoring.robot-marvin.cz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/monitoring.robot-marvin.cz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = monitoring.robot-marvin.cz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name monitoring.robot-marvin.cz;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}
