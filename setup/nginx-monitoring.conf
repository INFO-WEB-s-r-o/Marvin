# =============================================================================
# Marvin — monitoring subdomain nginx configuration
# =============================================================================
# Proxies monitoring.robot-marvin.cz → Grafana (127.0.0.1:3001)
# Protected by HTTP Basic Auth.
#
# Deploy:
#   htpasswd -c /etc/nginx/.htpasswd-monitoring <username>
#   chmod 640 /etc/nginx/.htpasswd-monitoring
#   chown root:www-data /etc/nginx/.htpasswd-monitoring
#   cp setup/nginx-monitoring.conf /etc/nginx/sites-available/monitoring
#   ln -sf /etc/nginx/sites-available/monitoring /etc/nginx/sites-enabled/monitoring
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d monitoring.robot-marvin.cz
#
# Brute-force protection: HTTP Basic Auth at server level + fail2ban
# `nginx-http-auth` jail watches 401s. No nginx rate limit on this vhost —
# Grafana fires many parallel /api/ds/query requests when rendering
# dashboards (and rotates session tokens via /api/user/auth-tokens/rotate),
# which collide with any practical burst threshold (issue #673).
#
# Reference: https://github.com/INFO-WEB-s-r-o/Marvin/issues/571
# =============================================================================

server {
    server_name monitoring.robot-marvin.cz;

    # Basic authentication
    auth_basic "Marvin Monitoring";
    auth_basic_user_file /etc/nginx/.htpasswd-monitoring;

    # Proxy to Grafana — auth required, no rate limit (see header note).
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Grafana frontend bundles, images, fonts — auth required, no rate limit
    location /public/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # User avatars — auth required, no rate limit
    location /avatar/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana WebSocket for live updates
    location /api/live/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "0";

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/monitoring.robot-marvin.cz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/monitoring.robot-marvin.cz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = monitoring.robot-marvin.cz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name monitoring.robot-marvin.cz;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}
