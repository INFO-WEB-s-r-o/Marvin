# =============================================================================
# Marvin — nginx rate limit zones
# =============================================================================
# Tracked copy of the rate-limit directives that must live inside the http{}
# block of /etc/nginx/nginx.conf. Split out from nginx-site.conf because
# limit_req_zone is an http-context directive, not a server-context one.
#
# Deploy: installed automatically by setup/bootstrap.sh (section 6, beside the
# export-key map) since #957. For a hand deploy to a running host:
#   cp setup/nginx-rate-limits.conf /etc/nginx/conf.d/marvin-rate-limits.conf
#   nginx -t && systemctl reload nginx
#
# This file is NOT optional. Both tracked vhosts reference these zones, so a host
# without it cannot load nginx-site.conf at all — `nginx -t` fails with
# `[emerg] zero size shared memory zone "api"`. Between 2026-06-08 and #957 the
# `cp` above was the only thing that installed it, and it was a comment: no
# script ran it, and self-test §9d only *diffs* the two copies, which degrades to
# a WARN when the live side was never created. self-test §9s now asserts that
# something installs these definitions.
#
# History:
#   2026-04-23 (PR #627): general 10→30 r/s, api 5→20 r/s. Sensitive unchanged.
#   2026-05-04 (PR #674): api 20→30 r/s (blog felt strict on dashboard refresh);
#                         added monitoring=5r/s for the Grafana vhost (#673).
# =============================================================================

limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=sensitive:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=monitoring:10m rate=5r/s;
limit_req_status 429;
