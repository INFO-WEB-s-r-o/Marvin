# =============================================================================
# Marvin — nginx rate limit zones
# =============================================================================
# Tracked copy of the rate-limit directives that must live inside the http{}
# block of /etc/nginx/nginx.conf. Split out from nginx-site.conf because
# limit_req_zone is an http-context directive, not a server-context one.
#
# Deploy:
#   cp setup/nginx-rate-limits.conf /etc/nginx/conf.d/marvin-rate-limits.conf
#   nginx -t && systemctl reload nginx
#
# History:
#   2026-04-23 (PR #627): general 10→30 r/s, api 5→20 r/s. Sensitive unchanged.
#   2026-05-04 (PR #674): api 20→30 r/s (blog felt strict on dashboard refresh);
#                         added monitoring=5r/s for the Grafana vhost (#673).
# =============================================================================

limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=sensitive:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=monitoring:10m rate=5r/s;
limit_req_status 429;
