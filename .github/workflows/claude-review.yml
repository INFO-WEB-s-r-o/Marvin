name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    timeout-minutes: 15
    if: |
      (github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --allowedTools
            "Read,Glob,Grep,
            Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh pr diff:*),
            mcp__github__create_issue,
            mcp__github__list_issues,
            mcp__github__add_issue_comment,
            mcp__github__list_pull_requests,
            mcp__github__get_pull_request_diff,
            mcp__github__get_pull_request_files,
            mcp__github__get_file_contents,
            mcp__github__get_commit"
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in the repository ${{ github.repository }}, following the guidelines in .github/CLAUDE.md.
            Use that PR number and repository for every `gh pr ...` and `mcp__github__*` call (e.g. `gh pr diff ${{ github.event.pull_request.number }}`, or `mcp__github__get_pull_request_diff` with pullNumber=${{ github.event.pull_request.number }}). Do NOT rely on the checked-out git branch: `actions/checkout` leaves a detached HEAD on `pull_request` events, so a bare `gh pr view` / `gh pr diff` with no number fails with "could not determine current branch".
            Perform both a code review and a security review.
            Be concise. Use severity labels: Critical, Warning, Suggestion, Good.
            When done, post your complete review as a comment on this pull request using `gh pr comment`.
            If you find any Critical or Warning issues, create GitHub issues for them and link them in your review comment.
            Always provide actionable feedback. If the code looks good, say so explicitly and approve the PR.
            Do not make assumptions about the code's intent. Base your review solely on the code changes in this pull request.
            If the pull request is large, focus on the most critical parts of the code.
