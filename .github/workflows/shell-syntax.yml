name: Shell syntax

# `self-test.sh` is the file that catches regressions in everything else, and a
# section inside it cannot assert that it parses — if the file is broken, the
# assertion never runs. That check has to live outside the file, which means CI.
#
# The `push: main` trigger is the one that matters. A conflict between two open
# PRs does not exist on either branch, so `pull_request` checks see two happily
# MERGEABLE branches; the merged state is only real after the merge lands. #920
# is exactly that shape: #911 and #912 each parse, and the resolution does not.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  bash-n:
    runs-on: ubuntu-latest
    # Without this the job inherits the 6-hour default. `bash -n` parses without
    # executing, so a fork PR cannot run code here — but it still submits the
    # bytes being parsed, and the wait is the cost either way. Measured on the
    # real tree: 53 tracked scripts in 0.23s, so the budget below is ~1000x the
    # work and the runtime is dominated by checkout. Matches claude-review.yml,
    # which bounds itself at 15.
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Parse every tracked shell script
        run: |
          set -euo pipefail
          broken=0
          total=0

          # GitHub parses *every* line of step output for workflow commands, so
          # both channels below are protocol, not prose. Escaping is per GitHub's
          # documented rules; `%` must be substituted first, or the `%2C` these
          # produce would itself be rewritten to `%252C`.
          #
          # Property values need `,` and `:` escaped as well as the newlines: the
          # property list is comma-delimited, so a comma in a tracked filename
          # injects further properties into the *same* annotation. A file named
          # `evil,line=99,title=Looks fine.sh` moves the error onto line 99 and
          # retitles it — the annotation stops describing the file it came from.
          _esc_prop() {
            local v="$1"
            v="${v//%/%25}"; v="${v//$'\r'/%0D}"; v="${v//$'\n'/%0A}"
            v="${v//,/%2C}"; v="${v//:/%3A}"
            printf '%s' "$v"
          }
          # Message text is not property-parsed, so only the three characters
          # that could end the line early are escaped. `%0A` renders as a real
          # newline inside the annotation, which is how multi-line `bash -n`
          # output is meant to be carried — decoded after the command is parsed,
          # so it cannot start a second one.
          _esc_msg() {
            local v="$1"
            v="${v//%/%25}"; v="${v//$'\r'/%0D}"; v="${v//$'\n'/%0A}"
            printf '%s' "$v"
          }

          # NUL-delimited end to end. Routing `-z` output through `tr '\0' '\n'`
          # undoes the only thing `-z` is for: a tracked name containing a raw
          # newline splits into two records, and if both halves happen to name
          # a file that parses, a script that does NOT parse is counted as two
          # clean ones and the gate reports PASS. Measured, not assumed — see
          # the CHANGELOG entry for the fixture that produces exactly that.
          while IFS= read -r -d '' f; do
            total=$((total + 1))
            if ! err=$(bash -n "$f" 2>&1); then
              # Both operands are attacker-influenced on a fork PR: the filename
              # is theirs, and `bash -n` echoes their source text back.
              #
              # The plain line is emitted with `%q`, not raw. Keeping the real
              # bytes here for a human reader was the earlier choice and it was
              # wrong — the log is the same channel as the annotation, so a
              # newline in the name puts its tail at column 0 and forges a
              # command from the line meant to be the honest one. `%q` renders
              # `evil<LF>::notice::x.sh` as a single unambiguous token instead.
              printf '::error file=%s::%s\n' "$(_esc_prop "$f")" "$(_esc_msg "$err")"
              printf 'BROKEN  %q\n%s\n' "$f" "$(printf '%s\n' "$err" | sed 's/^/    /')"
              broken=$((broken + 1))
            fi
          done < <(git ls-files -z -- '*.sh')

          # Zero files is not a pass. Either the pathspec stopped matching or the
          # layout moved, and both make every assertion above vacuous — the
          # "scanner broke" outcome must not be reported as "nothing found".
          if [[ "$total" -eq 0 ]]; then
            echo "FAIL: git ls-files matched no *.sh — the gate scanned nothing and cannot vouch for anything"
            exit 1
          fi

          echo "checked ${total} tracked shell script(s), ${broken} broken"
          [[ "$broken" -eq 0 ]]
