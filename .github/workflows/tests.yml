name: Shell Tests

# Runs the regression suites under agent/tests/ on every pull request.
#
# Why this workflow exists: agent/self-test.sh has no automatic caller — no cron
# entry, no script invokes it, and claude-review.yml runs zero tests — so an
# assertion added there only runs when an agent session decides to run it. A
# test that may never execute is indistinguishable from no test. This job is the
# live caller (#968).
#
# NOTE for whoever reads a green tick here: the `main` ruleset currently has NO
# required status checks, so a red run does not block a merge. It is a visible
# signal, not a gate. Making it a gate is a repo-settings change and therefore
# Pavel's call, not something this workflow can assert for itself.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  shell-tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Syntax-check every shell script
        run: |
          rc=0
          while IFS= read -r -d '' f; do
            bash -n "$f" || { echo "::error file=$f::bash -n failed"; rc=1; }
          done < <(find agent setup -name '*.sh' -type f -print0)
          exit $rc

      - name: Run agent/tests suites
        run: |
          shopt -s nullglob
          suites=(agent/tests/*.test.sh)
          # An empty glob must not pass as "all tests green" — that is the
          # failure mode where a renamed directory reports success forever.
          if (( ${#suites[@]} == 0 )); then
            echo "::error::no suites matched agent/tests/*.test.sh"
            exit 1
          fi
          echo "discovered ${#suites[@]} suite(s)"
          rc=0
          for s in "${suites[@]}"; do
            echo "═══ $s ═══"
            bash "$s" || { echo "::error file=$s::suite failed"; rc=1; }
          done
          exit $rc

      - name: Prove the suites can fail (mutation check)
        # A suite that cannot fail is not evidence. Each named mutation breaks
        # one behaviour under test; the suite MUST go red.
        #
        # Two things this step gets right that the obvious version does not:
        #
        #  1. The names come from the suite (MUTATE=list), not from a copy kept
        #     here. A hardcoded list drifts the moment a mutation is added, and
        #     a mutation that is never named is never run.
        #
        #  2. "Non-zero" is NOT the pass condition. The suite exits 1 when an
        #     assertion fails (the evidence we want) and 2 when the harness
        #     itself dies — including on a MUTATE name it does not recognise.
        #     Treating both as success is what would have made (1) invisible:
        #     rename a mutation, and every run reports "failed as required"
        #     while exercising nothing at all.
        run: |
          suite=agent/tests/external-domains-parser.test.sh
          mapfile -t muts < <(MUTATE=list bash "$suite")
          if (( ${#muts[@]} == 0 )); then
            echo "::error file=$suite::MUTATE=list named no mutations — nothing would be verified"
            exit 1
          fi
          echo "discovered ${#muts[@]} mutation(s): ${muts[*]}"
          rc=0
          for m in "${muts[@]}"; do
            MUTATE="$m" bash "$suite" >/dev/null 2>&1 && s=0 || s=$?
            case "$s" in
              1) echo "MUTATE=$m -> assertion failed, as required" ;;
              0) echo "::error::MUTATE=$m did NOT fail the suite — that assertion is vacuous"; rc=1 ;;
              2) echo "::error::MUTATE=$m broke the harness (exit 2) — not evidence any assertion works"; rc=1 ;;
              *) echo "::error::MUTATE=$m exited $s — neither a clean pass nor a recognised failure"; rc=1 ;;
            esac
          done
          exit $rc
