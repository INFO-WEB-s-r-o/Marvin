services:
  # OpenTelemetry Collector — receives telemetry from Claude Code sessions
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    container_name: marvin-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    restart: unless-stopped
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      # Bind to localhost only — Claude Code runs locally, no need to expose
      - "127.0.0.1:4317:4317"   # OTLP gRPC receiver
      - "127.0.0.1:4318:4318"   # OTLP HTTP receiver
      - "127.0.0.1:8889:8889"   # Prometheus metrics endpoint
    depends_on:
      - prometheus
    mem_limit: 256m

  # Prometheus — time-series storage for metrics
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: marvin-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
    mem_limit: 512m

  # Grafana — dashboards and visualization
  grafana:
    image: grafana/grafana:11.5.2
    container_name: marvin-grafana
    restart: unless-stopped
    ports:
      # Localhost only — access via SSH tunnel or nginx reverse proxy with auth
      - "127.0.0.1:3001:3000"
    environment:
      # SECURITY: Change this before first run or use .env file
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Run monitoring/setup.sh first to generate credentials}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    mem_limit: 256m

volumes:
  prometheus_data:
  grafana_data:
